name: Deploy Olingo on packagecloud
on:
  release:
    types: [released]

permissions:
  contents: read
  
jobs:
  deployment:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Deploy with Maven
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: mvn --batch-mode -s .github/workflows/settings.xml clean install deploy:deploy -DskipTests -Dskip.pojogen.examplebuild=true
