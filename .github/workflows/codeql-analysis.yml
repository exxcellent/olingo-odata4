name: "CodeQL"

on:
  schedule:
    - cron: '00 20 * * 3'
  push:
    branches: [master]
    paths-ignore:
      - 'LICENSE'
      - 'NOTICE'
      - 'README'
      - 'SECURITY.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'LICENSE'
      - 'NOTICE'
      - 'README'
      - 'SECURITY.md'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'java'

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'temurin'
        architecture: x64
        cache: maven

    - name: Build with Maven
      run: mvn -B clean package

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
